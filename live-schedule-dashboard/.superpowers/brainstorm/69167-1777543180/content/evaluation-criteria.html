<h2>排期"合理"的标准是什么？</h2>
<p class="subtitle">你截图里的 DetailPanel 显示了很多数据（跨科率、LTV、预计GMV），但缺少一个明确的"好/坏"判断标准</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>曝光量达标优先</h3>
      <p>S级必须≥45w、A级≥30w... 不达标就是不合理</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>预计GMV最大化优先</h3>
      <p>曝光可以少点，但跨科率×LTV 要高，最终 GMV 最大化才合理</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="content">
      <h3>人群消耗均衡优先</h3>
      <p>不希望某些品类 audience 被抢光，其他品类积压，要均匀消耗</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="content">
      <h3>以上综合，但我需要系统给我打分</h3>
      <p>系统根据多维度给一个"排期健康度"评分，我一眼看出哪里有问题</p>
    </div>
  </div>
</div>
